name: Release

# Publica uma versão quando o arquivo VERSION muda na main.
# A tag vX.Y.Z é criada pelo próprio GitHub ao publicar a Release.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "ASSET=IMP-Criativos-$VERSION" >> "$GITHUB_ENV"
          if [[ "$VERSION" == *-* ]]; then echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV"; else echo "PRERELEASE=" >> "$GITHUB_ENV"; fi
          echo "Publicando $TAG"

      - name: Cache da libjpeg-turbo
        uses: actions/cache@v4
        with:
          path: |
            Vendor/libjpeg-turbo
            Vendor/CTurboJPEG/turbojpeg.h
          key: libjpeg-turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_libjpeg_turbo.sh') }}

      - name: Compilar libjpeg-turbo (Otimizador em Lote)
        run: scripts/build_libjpeg_turbo.sh

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Compilar (Release, Apple Silicon)
        run: |
          set -o pipefail
          xcodebuild -project IMPCriativos.xcodeproj -scheme IMPCriativos -configuration Release \
            -derivedDataPath build ARCHS=arm64 \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_IDENTITY="-" build 2>&1 | tee build.log

      - name: Erros de compilação como anotações
        if: failure()
        run: |
          grep -E ': error: ' build.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -60 | \
            sed -E 's#^(.*):([0-9]+):([0-9]+): error: (.*)$#::error file=\1,line=\2,col=\3::\4#' || true

      - name: Assinar
        run: |
          APP="build/Build/Products/Release/IMP Criativos.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | head -5

      - name: Empacotar (.zip, .sha256, .dmg)
        run: |
          mkdir -p dist dmg
          APP="build/Build/Products/Release/IMP Criativos.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/$ASSET.zip"
          shasum -a 256 "dist/$ASSET.zip" | awk '{print $1}' > "dist/$ASSET.zip.sha256"
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Aplicativos
          hdiutil create -volname "IMP Criativos" -srcfolder dmg -ov -format UDZO "dist/$ASSET.dmg"
          ls -la dist

      - name: Notas da versão
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?"v"\\]?" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Versão $VERSION" > notes.md; fi
          cat >> notes.md <<'EOF'

          ---
          **Instalar:** baixe o `.dmg`, arraste o IMP Criativos para Aplicativos e, na primeira vez, abra com clique direito → Abrir.
          **Atualizar:** dentro do app, Configurações → Atualizações → Buscar atualização.
          EOF

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" $PRERELEASE --target "$GITHUB_SHA" --title "IMP Criativos $VERSION" --notes-file notes.md \
            "dist/$ASSET.dmg" "dist/$ASSET.zip" "dist/$ASSET.zip.sha256"

      # Link fixo do botão "Baixar para Mac" do README:
      #   releases/download/mac/IMP-Criativos.dmg  →  sempre a versão mais nova (inclusive beta).
      # A tag "mac" não é número de versão e não tem .zip, então o atualizador do app a ignora.
      - name: Atualizar link fixo de download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "dist/$ASSET.dmg" dist/IMP-Criativos.dmg
          NOTES="Link fixo usado pelo botão **Baixar para Mac** do README. Sempre contém a versão mais nova.

          Versão atual: **$VERSION** · [notas desta versão](https://github.com/${{ github.repository }}/releases/tag/$TAG)"
          if gh release view mac >/dev/null 2>&1; then
            gh release upload mac dist/IMP-Criativos.dmg --clobber
            gh release edit mac --notes "$NOTES" --prerelease --latest=false
          else
            gh release create mac --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Download — sempre a versão mais nova" --notes "$NOTES" dist/IMP-Criativos.dmg
          fi

      - name: Guardar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: build.log
          retention-days: 7

  # 1.0.0-beta.27: versão Windows. Roda depois do Mac (needs: release); se falhar, o Mac já está publicado.
  # Regra: a Release versionada só tem UM .zip (o do Mac, que o atualizador do Mac usa). O Windows sobe .exe e .exe.sha256.
  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Versão
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "SETUP=IMP-Criativos-Setup-$VERSION-windows-x64.exe" >> "$GITHUB_ENV"

      - name: Cache da libjpeg-turbo (Windows)
        uses: actions/cache@v4
        with:
          path: windows/vendor/libjpeg-turbo
          key: ljt-win-${{ runner.os }}-${{ hashFiles('scripts/build_libjpeg_turbo.sh', 'scripts/build_libjpeg_turbo_windows.ps1') }}

      - name: Compilar libjpeg-turbo (turbojpeg.dll)
        shell: pwsh
        run: scripts/build_libjpeg_turbo_windows.ps1

      - name: Testes
        env:
          IMP_TURBOJPEG_DIR: ${{ github.workspace }}\windows\vendor\libjpeg-turbo\win-x64
        run: dotnet test windows/tests/IMPCriativos.Tests/IMPCriativos.Tests.csproj -c Release

      - name: Publicar o app e gerar o instalador
        shell: pwsh
        run: windows/build/publish.ps1

      - name: Teste de fumaça
        shell: pwsh
        run: windows/build/smoke.ps1

      - name: Enviar para a Release (sem .zip)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd windows/artifacts/dist
          ls -la
          if ls *.zip >/dev/null 2>&1; then echo "Nada de .zip do Windows na Release"; exit 1; fi
          gh release upload "$TAG" "$SETUP" "$SETUP.sha256" --clobber

      # Link fixo do botão "Baixar para Windows" do README:
      #   releases/download/windows/IMP-Criativos-Setup.exe  →  sempre a versão mais nova (inclusive beta).
      # A tag "windows" não é número de versão e não tem .zip: os dois atualizadores a ignoram.
      - name: Atualizar link fixo de download (Windows)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "windows/artifacts/dist/$SETUP" windows/artifacts/dist/IMP-Criativos-Setup.exe
          NOTES="Link fixo usado pelo botão **Baixar para Windows** do README. Sempre contém a versão mais nova.

          Versão atual: **$VERSION** · [notas desta versão](https://github.com/${{ github.repository }}/releases/tag/$TAG)"
          if gh release view windows >/dev/null 2>&1; then
            gh release upload windows windows/artifacts/dist/IMP-Criativos-Setup.exe --clobber
            gh release edit windows --notes "$NOTES" --prerelease --latest=false
          else
            gh release create windows --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Download Windows — sempre a versão mais nova" --notes "$NOTES" windows/artifacts/dist/IMP-Criativos-Setup.exe
          fi

      - name: Linha de instalação do Windows nas notas
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --json body --jq .body > notes.md
          if ! grep -q "Instalar no Windows" notes.md; then
            printf '\n**Instalar no Windows:** baixe o `%s` e abra. Se aparecer "O Windows protegeu o computador", clique em **Mais informações → Executar assim mesmo** (o app não é assinado). Windows 10 (2004 ou mais novo) ou 11, 64 bits.\n' "$SETUP" >> notes.md
            gh release edit "$TAG" --notes-file notes.md
          fi

      - name: Capturas do teste de fumaça
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-windows-release
          path: windows/artifacts/smoke
          if-no-files-found: ignore
          retention-days: 14
