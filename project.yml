name: IMPCriativos
options:
  bundleIdPrefix: com.imperaservices
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0-beta.7"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  IMPCriativos:
    type: application
    platform: macOS
    sources:
      - path: Sources/IMPCriativos
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: "IMP Criativos"
        PRODUCT_BUNDLE_IDENTIFIER: com.imperaservices.impcriativos
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
    scheme: {}
  # 1.0.0-beta.19: testes automáticos da lógica de velocidade e do paralelismo (sem abrir o app, sem chamar IA).
  # Compila só os arquivos puros (Foundation) junto com os testes.
  IMPCriativosLogicTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/IMPCriativosLogicTests
      - path: Sources/IMPCriativos/Pipeline/SpeedPolicy.swift
      - path: Sources/IMPCriativos/Pipeline/BoundedParallel.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imperaservices.impcriativos.logictests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets: [IMPCriativosLogicTests]
