name: Release

# Publica uma versão quando o arquivo VERSION muda na main.
# A tag vX.Y.Z é criada pelo próprio GitHub ao publicar a Release.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "ASSET=IMP-Criativos-$VERSION" >> "$GITHUB_ENV"
          if [[ "$VERSION" == *-* ]]; then echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV"; else echo "PRERELEASE=" >> "$GITHUB_ENV"; fi
          echo "Publicando $TAG"

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Compilar (Release, Apple Silicon)
        run: |
          set -o pipefail
          xcodebuild -project IMPCriativos.xcodeproj -scheme IMPCriativos -configuration Release \
            -derivedDataPath build ARCHS=arm64 \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_IDENTITY="-" build 2>&1 | tee build.log

      - name: Erros de compilação como anotações
        if: failure()
        run: |
          grep -E ': error: ' build.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -60 | \
            sed -E 's#^(.*):([0-9]+):([0-9]+): error: (.*)$#::error file=\1,line=\2,col=\3::\4#' || true

      - name: Assinar
        run: |
          APP="build/Build/Products/Release/IMP Criativos.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | head -5

      - name: Empacotar (.zip, .sha256, .dmg)
        run: |
          mkdir -p dist dmg
          APP="build/Build/Products/Release/IMP Criativos.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/$ASSET.zip"
          shasum -a 256 "dist/$ASSET.zip" | awk '{print $1}' > "dist/$ASSET.zip.sha256"
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Aplicativos
          hdiutil create -volname "IMP Criativos" -srcfolder dmg -ov -format UDZO "dist/$ASSET.dmg"
          ls -la dist

      - name: Notas da versão
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?"v"\\]?" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Versão $VERSION" > notes.md; fi
          cat >> notes.md <<'EOF'

          ---
          **Instalar:** baixe o `.dmg`, arraste o IMP Criativos para Aplicativos e, na primeira vez, abra com clique direito → Abrir.
          **Atualizar:** dentro do app, Configurações → Atualizações → Buscar atualização.
          EOF

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" $PRERELEASE --target "$GITHUB_SHA" --title "IMP Criativos $VERSION" --notes-file notes.md \
            "dist/$ASSET.dmg" "dist/$ASSET.zip" "dist/$ASSET.zip.sha256"

      - name: Guardar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: build.log
          retention-days: 7
