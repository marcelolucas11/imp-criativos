name: Build (verificação)

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache da libjpeg-turbo
        uses: actions/cache@v4
        with:
          path: |
            Vendor/libjpeg-turbo
            Vendor/CTurboJPEG/turbojpeg.h
          key: libjpeg-turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_libjpeg_turbo.sh') }}

      - name: Compilar libjpeg-turbo (Otimizador em Lote)
        run: scripts/build_libjpeg_turbo.sh

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Compilar
        run: |
          set -o pipefail
          xcodebuild -project IMPCriativos.xcodeproj -scheme IMPCriativos -configuration Debug \
            -derivedDataPath build ARCHS=arm64 CODE_SIGN_IDENTITY="-" build 2>&1 | tee build.log

      - name: Testes automáticos (velocidade e paralelismo)
        run: |
          set -o pipefail
          xcodebuild -project IMPCriativos.xcodeproj -scheme IMPCriativosLogicTests -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build-tests ARCHS=arm64 CODE_SIGN_IDENTITY="-" test 2>&1 | tee test.log | grep -E "Test Case|Executed|error:|failed|ruído|granulação|riscos|temperatura|zoom agressivo|Otimizador:|SAMPLEB64" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" test.log

      # 1.0.0-beta.27: paridade Mac → Windows. O código Swift gera os prompts e sorteios do Otimizador;
      # a versão Windows (ParidadeMacTests) precisa dar exatamente o mesmo resultado.
      - name: Paridade Mac → Windows (prompts e sorteios)
        run: |
          scripts/paridade/gerar.sh /tmp/paridade-mac.json
          FIX=windows/tests/IMPCriativos.Tests/fixtures/paridade-mac.json
          if [ -f "$FIX" ]; then
            diff -u "$FIX" /tmp/paridade-mac.json || { echo "::error::Prompts ou sorteios do Mac mudaram: rode scripts/paridade/gerar.sh e atualize a versão Windows no mesmo PR."; exit 1; }
          else
            echo "::warning::$FIX ainda não existe (baixe o artefato paridade-mac e coloque no repositório)."
          fi

      - name: Guardar paridade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paridade-mac
          path: /tmp/paridade-mac.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Velocidade das texturas (Release, swiftc -O)
        run: |
          mkdir -p /tmp/bench
          cat > /tmp/bench/main.swift <<'EOF'
          import Foundation
          let W = 1080, H = 1920
          var px = [UInt8](repeating: 0, count: W * H * 4)
          for y in 0..<H { for x in 0..<W { let v = UInt8(30 + x * 40 / W + y * 20 / H); let o = (y * W + x) * 4; px[o] = v; px[o + 1] = v / 2; px[o + 2] = v } }
          for b in 0..<12 { for y in (200 + b * 120)..<(240 + b * 120) { for x in 100..<(1000 - b * 30) { let o = (y * W + x) * 4; px[o] = 255; px[o + 1] = 255; px[o + 2] = 255 } } }
          var p = StoryParams()
          p.lineOpacity = 0.6; p.lineSpacing = 8; p.lineThickness = 3; p.lineDirection = .cross; p.lineBlend = .hardLight; p.linePhase = 1; p.linePhase2 = 4
          var jitter = [Double](), lines = [Double]()
          for i in 0..<6 {
              var t = px
              let t0 = Date()
              StoryTextureEffects.applyEdgeJitter(&t, width: W, height: H, level: 1, seed: 7)
              let t1 = Date()
              StoryTextureEffects.applyLines(&t, width: W, height: H, params: p)
              let t2 = Date()
              if i > 0 { jitter.append(t1.timeIntervalSince(t0) * 1000); lines.append(t2.timeIntervalSince(t1) * 1000) }
          }
          var tp = p
          tp.lineStyle = .tone; tp.lineOpacity = 0.3; tp.lineSpacing = 10; tp.lineThickness = 2; tp.lineAngle = 55; tp.lineIrregularity = 0.6; tp.lineSeed = 99
          var tone = [Double]()
          for i in 0..<6 {
              var t = px
              let t0 = Date()
              StoryTextureEffects.applyLines(&t, width: W, height: H, params: tp)
              if i > 0 { tone.append(Date().timeIntervalSince(t0) * 1000) }
          }
          print("Texturas em Release 1080x1920: serrilhado \(String(format: "%.0f", jitter.min()!)) ms, linhas \(String(format: "%.0f", lines.min()!)) ms, linhas no tom (X) \(String(format: "%.0f", tone.min()!)) ms")
          // limites largos (o medido fica perto de 30 ms e 5 ms): pegam uma regressão grande sem depender da máquina do CI
          if jitter.min()! > 400 || lines.min()! > 150 || tone.min()! > 500 { print("Texturas lentas demais em Release"); exit(1) }
          EOF
          swiftc -O Sources/IMPCriativos/Pipeline/StoryOptimizerParams.swift Sources/IMPCriativos/Pipeline/StoryTextureEffects.swift /tmp/bench/main.swift -o /tmp/bench/bench
          /tmp/bench/bench

      - name: Amostras do Otimizador em Lote
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amostras-otimizador-stories
          path: /tmp/imp-story-samples
          if-no-files-found: ignore
          retention-days: 7

      - name: Erros de compilação como anotações
        if: failure()
        run: |
          cat build.log test.log 2>/dev/null | grep -E ': error: ' | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -60 | \
            sed -E 's#^(.*):([0-9]+):([0-9]+): error: (.*)$#::error file=\1,line=\2,col=\3::\4#' || true

      - name: Guardar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            test.log
          if-no-files-found: ignore
          retention-days: 7

  # 1.0.0-beta.27: versão Windows. Os testes do Core rodam também no Linux (mais rápido).
  windows-core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Eixos gerados em dia (Mac e Windows)
        run: |
          python3 scripts/eixos_variacao.py .
          git diff --exit-code -- Sources/IMPCriativos/Models/DefaultAxes.swift docs/EIXOS-DE-VARIACAO.md windows/src/IMPCriativos.Core/Models/DefaultAxes.cs

      - name: Cache da libjpeg-turbo (Linux)
        uses: actions/cache@v4
        with:
          path: windows/vendor/libjpeg-turbo
          key: ljt-win-${{ runner.os }}-${{ hashFiles('scripts/build_libjpeg_turbo.sh', 'scripts/build_libjpeg_turbo_windows.ps1') }}

      - name: Compilar libjpeg-turbo (Linux, para os testes)
        shell: pwsh
        run: scripts/build_libjpeg_turbo_windows.ps1

      - name: Testes do Core
        env:
          IMP_TURBOJPEG_DIR: ${{ github.workspace }}/windows/vendor/libjpeg-turbo/linux-x64
          IMP_PARIDADE_OUT: ${{ github.workspace }}/windows/artifacts
          IMP_STORY_SAMPLES: ${{ github.workspace }}/windows/artifacts/amostras
        run: dotnet test windows/tests/IMPCriativos.Tests/IMPCriativos.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Saídas dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-core-linux
          path: windows/artifacts
          if-no-files-found: ignore
          retention-days: 7

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache da libjpeg-turbo (Windows)
        uses: actions/cache@v4
        with:
          path: windows/vendor/libjpeg-turbo
          key: ljt-win-${{ runner.os }}-${{ hashFiles('scripts/build_libjpeg_turbo.sh', 'scripts/build_libjpeg_turbo_windows.ps1') }}

      - name: Compilar libjpeg-turbo (turbojpeg.dll)
        shell: pwsh
        run: scripts/build_libjpeg_turbo_windows.ps1

      - name: Compilar a solução
        run: dotnet build windows/IMPCriativos.Windows.sln -c Release

      - name: Testes
        env:
          IMP_TURBOJPEG_DIR: ${{ github.workspace }}\windows\vendor\libjpeg-turbo\win-x64
        run: dotnet test windows/tests/IMPCriativos.Tests/IMPCriativos.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Publicar o app (self-contained)
        shell: pwsh
        run: windows/build/publish.ps1

      - name: Teste de fumaça (todas as telas, Otimizador, capturas)
        shell: pwsh
        run: windows/build/smoke.ps1

      - name: Capturas das telas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-windows
          path: windows/artifacts/smoke
          if-no-files-found: ignore
          retention-days: 14
